#textdomain wesnoth-Ageless_Era

#define AE_UNUPGRADABLE_STRIKES NUMBER
    [swarm]
        name= _ "unupgradable" + {NUMBER}
        description=_"This attack always has "+{NUMBER}+_" strikes"
        swarm_attacks_max={NUMBER}
        swarm_attacks_min={NUMBER}
    [/swarm]
#enddef

#define AE_WEAPON_SPECIAL_HARMLESS
    [damage]
        id=AE_harmless
        name= _ "harmless"
        description= _ "This attack does no damage."
        multiply=0
    [/damage]
#enddef

#define WEAPON_SPECIAL_AE_SPECIAL_COUNTER
    [chance_to_hit]
        id=AE_special_counter
        name= _ "special counter"
        description= _ "This attack reduces magical chance to hit of opponents by 30% (down to 40%). It also reduces enchanted chance to hit of opponents by 20% (down to 40%). It also reduces precision chance to hit of opponents by 30% (down to 50%)."
        add=-30
        apply_to=opponent
        [filter_opponent]
            [filter_weapon]
                special_id=magical,AE_mag_magical_defensive,AE_mag_magical_offensive,AE_mag_precision,AE_mag_precision_cumulative,AE_mag_precision_offensive,AE_agl_steelhive_precision
            [/filter_weapon]
        [/filter_opponent]
    [/chance_to_hit]
    [chance_to_hit]
        id=AE_special_counter2
        add=-20
        apply_to=opponent
        [filter_opponent]
            [filter_weapon]
                special_id=AE_mag_enchanted
            [/filter_weapon]
        [/filter_opponent]
    [/chance_to_hit]
#enddef

#define WEAPON_SPECIAL_AE_SABOTAGE
    [damage]
        id=AE_special_sabotage
        name= _ "sabotage"
        description= _ "In offensive the opponent retaliates with x0.875 damage"
        apply_to=opponent
        active_on=offense
        multiply=0.875
    [/damage]
#enddef

#define WEAPON_SPECIAL_AE_GAZE
    [chance_to_hit]
        id=AE_special_gaze_1
        name= _ "gaze"
        description=_"In offensive, accuracy increase by 10%, opponent accuracy decrease by 10% (including magical and other special modifiers)"
        apply_to=self
        active_on=offense
        add=10
    [/chance_to_hit]
    [chance_to_hit]
        id=AE_special_gaze_2
        apply_to=opponent
        active_on=offense
        sub=10
    [/chance_to_hit]
#enddef

#define WEAPON_SPECIAL_AE_VINDICATE
    [chance_to_hit]
        id=AE_special_vindicate
        name= _ "vindicate"
        description=_"In offensive, accuracy increase by 20%"
        apply_to=self
        active_on=offense
        add=20
    [/chance_to_hit]
#enddef

#define WEAPON_SPECIAL_AE_NIGHTCOVER MULTIPLIER PERCENT
    [damage]
        id=AE_special_nightcover
        multiply={MULTIPLIER}
        apply_to=opponent
        name= _ "night cover (" + {PERCENT} + "%)"
        description= _ "During night time, damage dealt to this unit is reduced by " + {PERCENT} + "%."
        [filter_self]
            [filter_location]
                time_of_day=chaotic
            [/filter_location]
        [/filter_self]
    [/damage]
#enddef

#define WEAPON_SPECIAL_AE_DAYCOVER MULTIPLIER PERCENT
    [damage]
        id=AE_special_daycover
        multiply={MULTIPLIER}
        apply_to=opponent
        name= _ "day cover (" + {PERCENT} + "%)"
        description= _ "During day time, damage dealt to this unit is reduced by " + {PERCENT} + "%."
        [filter_self]
            [filter_location]
                time_of_day=lawful
            [/filter_location]
        [/filter_self]
    [/damage]
#enddef

#define WEAPON_SPECIAL_AE_NIGHTCOVER_10
    {WEAPON_SPECIAL_AE_NIGHTCOVER 0.9 10}
#enddef

#define WEAPON_SPECIAL_AE_NIGHTCOVER_20
    {WEAPON_SPECIAL_AE_NIGHTCOVER 0.8 20}
#enddef

#define WEAPON_SPECIAL_AE_NIGHTCOVER_30
    {WEAPON_SPECIAL_AE_NIGHTCOVER 0.7 30}
#enddef

#define WEAPON_SPECIAL_AE_DAYCOVER_10
    {WEAPON_SPECIAL_AE_DAYCOVER 0.9 10}
#enddef