#textdomain wesnoth-Ageless_Era

[unit_type]
    id=AE_mrc_cult_Spy
    name= _ "Spy"
    race=AE_mrc_mutant_race
    gender=male
    image="units/cult/spy.png"
    profile="portraits/cult/spy.png~RC(magenta>black)"
    hitpoints=52
    movement_type=AE_mrc_cultlightfoot
    movement=7
    experience=134
    level=3
    alignment=chaotic
    advances_to=null
    {AMLA_DEFAULT}
    die_sound={SOUND_LIST:HUMAN_DIE}
    cost=57
    usage=fighter
    #
    description={AE_MRC_UNIT_NOTICE}+_"Spies are the most mysterious of all cultists, he's probably watching the human society disorders and refusing his human nature past... maybe this allows him to acomplish the factions goals... who knows if they were mentally right or not before the genetic manipulation ... but sure thing is that there is no regret in any of its actions"

    [resistance]
        blade=120
        pierce=110
		cold=80
		arcane=100
    [/resistance]

    [abilities]
        {ABILITY_NIGHTSTALK}
        {ABILITY_SKIRMISHER}
    [/abilities]

    #{DEFENSE_ANIM "" "" {SOUND_LIST:HUMAN_HIT} }

    [attack]
        name=Dagger
        description={STR_DAGGER}
        icon=attacks/dagger-undead.png
        type=blade
        range=melee
        damage=7
        number=3
        [specials]
            {WEAPON_SPECIAL_BACKSTAB}
			{WEAPON_SPECIAL_POISON}
        [/specials]
    [/attack]

    [attack_anim]
        [filter_attack]
            name=Dagger
        [/filter_attack]
        start_time=-300
        [frame]
            duration=400
            image="units/cult/spy.png"
            sound=dagger-swish.wav
        [/frame]
    [/attack_anim]

    [attack]
        name=Blowgun
        description= _ "Blowgun"
        icon=attacks/dagger-thrown-poison-orcish.png
        type=pierce
        range=ranged
        damage=9
        number=2
        [specials]
            {AE_CHS_WEAPON_SPECIAL_AIMED}
            {WEAPON_SPECIAL_POISON}
        [/specials]
    [/attack]

    [attack_anim]
        [filter_attack]
            name=Blowgun
        [/filter_attack]
        missile_start_time=-250
        [missile_frame]
            duration=250
            image="projectiles/thorns.png"
            image_diagonal="projectiles/thorns-ne.png"
            sound=magic-thorns-miss-1.ogg
        [/missile_frame]
        start_time=-500
        [frame]
            image=units/cult/spy.png
        [/frame]
    [/attack_anim]


[/unit_type]
