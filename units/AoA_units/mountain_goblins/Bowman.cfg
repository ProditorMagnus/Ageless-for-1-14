#textdomain wesnoth-Ageless_Era
[unit_type]
    id=AE_AoA_mountain_goblins_Bowman
    name= _ "Bowman"
    race=gobmon
    gender=male
    image="units/gobmon/archer.png"
    hitpoints=26
    movement_type=AE_gobmon
    movement=5
    experience=34
    level=1
    alignment=chaotic
    cost=13
    usage=archer
    description={AE_AOA_UNIT_NOTICE}+ _ "Goblin bowmen while particularly not potent, they learn to fire quite fast and with some experience they lose fear at trying to use burning arrows."
    advances_to=AE_AoA_mountain_goblins_Ranger
    die_sound={SOUND_LIST:GOBLIN_DIE}
    {DEFENSE_ANIM "units/gobmon/archer.png" "units/gobmon/archer.png" {SOUND_LIST:GOBLIN_HIT} }

    [defense]
        forest=40
    [/defense]

    [attack]
        name=dague
        description={STR_KNIFE}
        type=blade
        range=melee
        damage=3
        number=2
        icon=attacks/dagger-orcish.png
    [/attack]
    [attack]
        name=arc
        description={STR_BOW}
        type=pierce
        range=ranged
        damage=4
        number=4
        icon=attacks/bow-orcish.png
    [/attack]
    [attack]
        name=fire arrow
        description={STR_BOW}
        icon=attacks/bow-orcish.png
        type=fire
        range=ranged
        damage=6
        number=2
    [/attack]

    {RAPIER_SOUND}
    {BOW_SOUND}
[/unit_type]
