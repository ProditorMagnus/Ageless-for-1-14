#textdomain wesnoth-Ageless_Era
[unit_type]
    id=AE_rhy_ce_Corvette
    name= _ "Corvette"
    race=mechanical
    {AE_RHY_TRAIT_UNSLOWABLE_MUSTHAVE}
    image="units/ships/chevalier-corvette.png"
    hitpoints=63
    movement_type=AE_RHY_ship
    movement=8
    experience=85
    level=2
    alignment=neutral
    advances_to=null
    [advancement]
        strict_amla=yes
        max_times=1
        id=amla_ab crew
        description= _"Larger crew"
        [effect]
            apply_to=hitpoints
            increase_total=3
            heal_full=yes
        [/effect]
        {AE_RHY_AMLA_TEMPLATE 0 25% "attacks/battleaxe.png"}
        [effect]
            apply_to=attack
            name=crew
            increase_attacks=1
        [/effect]
        [effect]
            apply_to=movement
            increase=1
        [/effect]
    [/advancement]
    [advancement]
        strict_amla=yes
        max_times=1
        id=amla_ab ballista
        description= _"Additional ballistas"
        [effect]
            apply_to=hitpoints
            increase_total=3
            heal_full=yes
        [/effect]
        {AE_RHY_AMLA_TEMPLATE 0 25% "attacks/ballista.png"}
        [effect]
            apply_to=attack
            name=ballista
            increase_attacks=1
        [/effect]
        [effect]
            apply_to=attack
            name=ballista
            [set_specials]
                {WEAPON_SPECIAL_FIRSTSTRIKE}
                mode=append
            [/set_specials]
        [/effect]
    [/advancement]
    {AMLA_DEFAULT}
    cost=30
    usage=ship
    description= _""
    [resistance]
        pierce=50
    [/resistance]
    [attack]
        name=crew
        description= _ "armed crew"
        icon=attacks/battleaxe.png
        type=blade
        range=melee
        damage=6
        number=3
    [/attack]
    [attack]
        name=ballista
        description={STR_BALLISTA}
        icon=attacks/ballista.png
        type=pierce
        range=ranged
        damage=8
        number=3
    [/attack]
    [attack_anim]
        [filter_attack]
            name=crew
        [/filter_attack]
        start_time=-150
        [if]
            hits=no
            [frame]
                duration=300
                image="units/ships/chevalier-corvette.png"
                sound={SOUND_LIST:MISS}
            [/frame]
        [/if]
        [else]
            hits=yes
            [frame]
                duration=300
                image="units/ships/chevalier-corvette.png"
                sound=axe.ogg
            [/frame]
        [/else]
    [/attack_anim]
    [attack_anim]
        [filter_attack]
            name=ballista
        [/filter_attack]
        start_time=-445
        missile_start_time=-150
        [missile_frame]
            duration=150
            image="projectiles/missile-n.png"
            image_diagonal="projectiles/missile-ne.png"
        [/missile_frame]
        [frame]
            image="units/ships/chevalier-corvette.png:65"
        [/frame]
        [frame]
            image="units/ships/chevalier-corvette.png:445"
        [/frame]
        {SOUND:HIT_AND_MISS bow.ogg bow-miss.ogg -230}
    [/attack_anim]
[/unit_type]
